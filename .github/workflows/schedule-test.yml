name: Schedule Test

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger and time
        run: |
          echo "event=${{ github.event_name }}"
          echo "UTC time:"
          date -u
          echo "Beijing time:"
          TZ=Asia/Shanghai date
