name: BJMF 21:10 Task Check

on:
  workflow_dispatch:
  schedule:
    - cron: '10 21 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

jobs:
  check-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ClassID: ${{ secrets.ClassID }}
      MYCOOKIE: ${{ secrets.MYCOOKIE }}
      TOKEN: ${{ secrets.TOKEN }}
      POLL_SECONDS: '30'
      MAX_CHECKS: '20'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --upgrade requests

      - name: Check active BJMF task
        run: python check_task.py
